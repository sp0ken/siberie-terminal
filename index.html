  body {
    color: var(--fg);
    font-family: "Pixel Code", "SF Mono", ui-monospace, Menlo, Monaco, "Courier New", monospace;
    font-size: 18px;
    line-height: 1.35;
    -webkit-text-size-adjust: 100%;
  }
  #crt {
    position: fixed; inset: 0; overflow: hidden;
    border-radius: 4.5vmin; /* coins arrondis du tube */
    background: radial-gradient(ellipse at center, #06200f 0%, #010603 100%);
  }
  /* contenu soumis à la distorsion en barillet (filtre SVG #crtwarp, cf. JS) */
  #world { position: absolute; inset: 0; }
  #world.warp { -webkit-filter: url(#crtwarp); filter: url(#crtwarp); }
  /* grain statique animé */
  #noise {
    position: absolute; inset: -50%; pointer-events: none; z-index: 4; opacity: .09;
    background-size: 96px 96px; animation: noise .6s steps(1) infinite;
  }
  @keyframes noise {
    0% { transform: translate(0,0); } 20% { transform: translate(-7%,4%); } 40% { transform: translate(5%,-6%); }
    60% { transform: translate(-3%,-8%); } 80% { transform: translate(8%,6%); }
  }
  /* barre de balayage qui descend lentement */
  #roll {
    position: absolute; left: 0; right: 0; height: 22%; top: -25%; pointer-events: none; z-index: 4;
    background: linear-gradient(to bottom, rgba(120,255,170,0), rgba(120,255,170,.05), rgba(120,255,170,0));
    animation: roll 9s linear infinite;
  }
  @keyframes roll { to { top: 105%; } }
  /* vitre bombée : ombre intérieure + reflet */
  #glass {
    position: absolute; inset: 0; pointer-events: none; z-index: 7; border-radius: 4.5vmin;
    box-shadow: inset 0 0 9vmin 1vmin rgba(0,0,0,.9), inset 0 0 1.5vmin rgba(0,0,0,.95);
    background:
      radial-gradient(120% 70% at 28% 8%, rgba(150,255,190,.08), rgba(150,255,190,0) 55%),
      radial-gradient(ellipse at 75% 95%, rgba(150,255,190,.03), rgba(150,255,190,0) 50%);
  }
  @media (prefers-reduced-motion: reduce) { #noise, #roll { animation: none; } }
  /* scanlines */
  #crt::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.25) 3px);
  }
  /* vignette */
  #crt::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
  }
  #screen {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(4vh + env(safe-area-inset-top)) 5vw calc(8vh + env(safe-area-inset-bottom));
    text-shadow: 0 0 4px rgba(56,255,122,.7), 0 0 14px rgba(56,255,122,.25);
    scrollbar-width: none;
    animation: flicker 6s infinite;
  }
  #screen::-webkit-scrollbar { display: none; }
  #inner { max-width: 100ch; margin: 0 auto; }
  .ln { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.35em; }
  .dim { color: var(--dim); }
  .art { white-space: pre; overflow: hidden; flex: none; }
  .boot { display: flex; flex-wrap: wrap; align-items: center; column-gap: 4ch; }
  .boot .col { flex: 1 1 40ch; min-width: 0; }
  .gate-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1.35em; }
  .inv { background: var(--fg); color: var(--bg); text-shadow: none; width: fit-content; max-width: 100%; padding: 0 .5ch; }
  .opt.sel { background: var(--fg); color: var(--bg); text-shadow: none; }
  .caret { background: var(--fg); color: var(--bg); text-shadow: none; animation: blink 1.06s steps(1) infinite; }
  .blink { animation: blinktext 1.06s steps(1) infinite; }
  @keyframes blink { 50% { background: transparent; color: var(--fg); } }
  @keyframes blinktext { 50% { opacity: 0; } }
  @keyframes flicker {
    0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .94; } 49% { opacity: 1; }
    80% { opacity: .98; } 81% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { #screen { animation: none; } }
  /* visionneuse de documents (pagination) */
  #viewer {
    position: absolute; inset: 0; z-index: 2;
    padding: calc(3vh + env(safe-area-inset-top)) 5vw calc(3vh + env(safe-area-inset-bottom));
    text-shadow: 0 0 4px rgba(56,255,122,.7), 0 0 14px rgba(56,255,122,.25);
    animation: flicker 6s infinite;
  }
  #viewer[hidden] { display: none; }
  #vin { max-width: 100ch; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  #vhead, #vfoot { background: var(--fg); color: var(--bg); text-shadow: none; padding: 0 1ch; white-space: pre; overflow: hidden; flex: none; }
  #vhead { margin-bottom: 1.35em; }
  #vfoot { margin-top: 1.35em; }
  #vbody { flex: 1; min-height: 0; overflow: hidden; }
  #kb {
    position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0;
    border: 0; padding: 0; margin: 0; font-size: 16px; caret-color: transparent; background: transparent;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="crtwarp" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
          x="0" y="0" width="1024" height="768" color-interpolation-filters="sRGB">
    <feImage id="warpmap" x="0" y="0" width="1024" height="768" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap id="warpdisp" in="SourceGraphic" in2="map" scale="60" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="crt">
  <div id="world">
    <div id="screen"><div id="inner"><div id="out"></div></div></div>
    <div id="viewer" hidden><div id="vin"><div id="vhead"></div><div id="vbody"></div><div id="vfoot"></div></div></div>
  </div>
  <div id="noise"></div>
  <div id="roll"></div>

<!--DATA_START--><script>const DATA = {"documents": [{"name": "0001 - Règlement", "users": [], "body": "Règlement intérieur du C.R.O.\n(Version synthétique)\nÉdité sous l autorité du Colonel-Directeur Oïmiak, sur proposition du Bureau Central du C.S.I., validé par le\nBureau Impérial des Standards & Protocoles.\n\nSECTION I — De la hiérarchie\n1. L’obéissance à la hiérarchie impériale, militaire et scientifique, est absolue.\n2. Tout ordre donné par la hiérarchie doit être exécuté sans délai, discussion, ni interprétation.\n3. Chaque assistant agit sous la supervision d’un Administrateur au sein de son laboratoire. Les\nAdministrateurs opèrent sous l’autorité du colonel Directeur.\n4. Le salut impérial est obligatoire. Il consiste à se frapper le cœur avec le poing droit.\n\nSECTION II – De la confidentialité des données\n5. La Directive du C.S.I., n° CSI-47-R/OBF en matière de confidentialité des données scientifiques est\npleinement applicable au C.R.O. cf. annexe 1.\n6. La divulgation d’informations non autorisées (même à un collègue d’un autre laboratoire) est interdite.\n7. Les communications personnelles vers l’extérieur sont formellement interdites. Seul le Directeur et le B.S.I.\npeuvent autoriser une dérogation exceptionnelle. Les communications professionnelles doivent utiliser le\ncanal exclusif de haute sécurité du C.R.O.\n\nSECTION III – De la conduite\n8. La courtoisie impériale est obligatoire : tout différend personnel doit être réglé par voie hiérarchique,\nnon par confrontation directe.\n9. Les comportements de déviance, d’insubordination ou de fraternisation excessive seront consignés au\ndossier psychologique.\n10. Les discussions d’ordre politique, spirituel ou philosophique sont strictement prohibées dans les\nlaboratoires et durant les temps de travail.\n\nSECTION IV – De la sécurité & hygiène\n11. L’accès à toute zone définie comme restreinte nécessite un double contrôle d’identité et\nd’autorisation.\n12. Le port du badge d’identification est obligatoire en tout lieu.\n13. Le personnel est informé que les zones communes et les laboratoires sont placés sous surveillance\nholo-visuelle continue.\n14. Les modules de contrôle biométrique sont installés pour garantir la sécurité de chacun ; toute tentative\nde sabotage ou de contournement sera sanctionnée.\n15. Les produits dangereux et instruments d’expérimentation doivent être consignés après usage.\n16. Toute panne, anomalie technique ou incident biologique doit être signalé au département Logistique\net à la section de Maintenance.\n17. Les armes sont strictement réservées au personnel en charge de la sécurité.\n\nSECTION V – Du travail scientifique\n18. Le fruit de toutes les recherches du C.R.O. est la propriété exclusive de l'Empire.\n19. Les protocoles de recherche doivent être suivis sans déviation ni improvisation.\n20. Les expérimentations non accréditées par l'Administrateur du laboratoire sont interdites, même à titre\nexploratoire.\n21. Tout rapport doit être rédigé dans le format impérial standard et transmis à l'Administrateur du\nlaboratoire.\n22. Tout résultat de recherche doit être consigné, y compris en cas d'échec.\n23. Les cobayes ont le statut de matériel expérimental, et sont la propriété de l’Empire. Aucune\nfraternisation, discussion ou initiative personnelle envers eux ne sera tolérée. Les droïdes de recherche\nsont de précieux équipements impériaux. Tout ordre contradictoire à leur programmation entraînera une\nprocédure disciplinaire pour sabotage.\n24. La consultation des archives classifiées nécessite une demande motivée par un chercheur,\ncontresignée par l'Administrateur du laboratoire.\n\nSECTION VI – De la vie en collectivité\n25. Le couvre-feu est fixé à 23:00 heures standard. Toute circulation après cette heure doit être justifiée.\n26. Les rations et produits médicaux sont attribués individuellement et ne doivent en aucun cas être\nstockés sans autorisation.\n27. La ponctualité est une vertu impériale.\n28. La curiosité non autorisée est un \"vice républicain\".\n29. Le repos est une nécessité opérationnelle, pas un droit.\n30. Les relations interpersonnelles (romantiques, amicales ou conflictuelles) doivent rester subordonnées\nà la mission impériale.\n31. Aucun propos anti-impérial ne sera toléré.\n32. Tout signalement, toute information erronée et toute alerte sonore injustifiée est sanctionnable."}, {"name": "0002 - Accréditions", "users": [], "body": "Accréditations des données\n\nNiveaux de confidentialité au sein du C.R.O. :\n- Niveau 0 : décret public accessible à tous les résidents de la Lune.\n- Niveau 1 : document interne du C.R.O. ne comportant aucune information sensible.\n- Niveau 2 : document de travail confidentiel peu sensible (réservé aux officiers chercheurs du labo\nconcerné)\n- Niveau 3 : document confidentiel sensible (réservé au colonel directeur).\n- Niveau 4 : document confidentiel très sensible (réservé au Bureau Central du C.S.I.)\n- Niveau 5 : document relevant du Secret Impérial (réservé aux Moffs et à l’Empereur)"}, {"name": "0003 - Grille disciplinaire", "users": [], "body": "Grille disciplinaire\n\nCatégorie A — Faute majeure\nCas de figure : trahison, espionnage, sabotage, atteinte à la sécurité de l’Empire…\nSanctions possibles : dégradation puis désintégration en place publique, dégradation puis travaux forcés\ndans les mines de Kessel, dégradation, puis condamnation à servir de cobaye dans les laboratoires du\nC.S.I., intégration au programme de rééducation politique du B.S.I. avec ou sans dégradation, mise au\nsecret.\n\nCatégorie B — Faute moyenne\nCas de figure : Insubordination, manquement grave à la discipline ou à la procédure…\nSanctions possibles : suspension temporaire, isolement disciplinaire et/ou médical, inscription au dossier\npsychologique, suspension de l’avancement, rétrogradation, mutation.\n\nCatégorie C — Faute mineure :\nCas de figure : Négligence, désordre, atteinte mineure à la productivité ou à l’image impériale.\nSanctions possibles : avertissement écrit, corvée de maintenance, suppression de rations, rappel à l’ordre\npublic, retrait de prime impériale.\n\nN.B. 1 : Trois fautes mineures (C) valent une moyenne (B). Trois moyennes (B) valent une majeure (A).\nN.B. 2 : Les officiers sont habilités à sanctionner des fautes mineures (C). Le colonel est habilité à\nsanctionner des fautes moyennes (B). Seul le Bureau Central du C.S.I. et celui du B.S.I. sont habilités à\nsanctionner des fautes majeures (A)."}, {"name": "0077 - Notice Skrigs - Mine 312 (version normalisée)", "users": [], "body": "Mine 312  •  Extraits normalisés du journal d’exploitation et notice xéno-administrative\n\nACCREDITATION NIVEAU 1\nCONSULTATION AUTORISÉE SELON DIRECTIVE CSI-47-R/OBF\nRéférence : IMP-XENO-OI/Σ-77 / NOTICE 01\n\nSource : Registres anciens de la mine 312 ; synthèse du Bureau Impérial de Xéno-Classification\n\nStatut : APPROUVÉ POUR CONSULTATION INTERNE — version normalisée\nObjet : Signalements relatifs à une faune cavernicole présumée\nI. CLASSIFICATION ADMINISTRATIVE\n\nDésignation usuelle : « Skrig » (appellation de terrain, issue d’un cri rapporté par les anciennes équipes minières).\n\nClassification actuelle : faune cavernicole non sentiente. L’appellation ne constitue pas une identification zoologique formelle.\n\nHabitat présumé : galeries naturelles obscures du secteur d’Oïmiakon, avec signalements anciens dans le périmètre de la mine 312. Activité principalement nocturne ou en pénombre ; fuite fréquente lors de l’allumage de projecteurs puissants.\n\nAucune technologie élaborée, aucune structure de commandement et aucun mode de communication intelligible n’ont été homologués par les services compétents. Les regroupements ponctuels consignés dans les journaux sont interprétés comme des comportements grégaires.\n\nII. EXTRAITS DU JOURNAL D’EXPLOITATION — VERSION NORMALISÉE\n\nLes relevés ci-dessous proviennent de registres miniers d’âges différents. Plusieurs dates et identifiants d’équipe n’ont pas été conservés lors de l’archivage. Les commentaires administratifs priment sur les interprétations des anciens opérateurs.\n\nRELEVÉ A — GALERIES FAIBLEMENT ÉCLAIRÉES\n\n« Formes sombres signalées en marge d’un front de taille ; plus aucune présence constatée après mise en service des projecteurs. »\n\nLecture administrative : Faune lucifuge probable. Aucun comportement offensif établi.\n\nRELEVÉ B — ÉCARTS D’INVENTAIRE\n\n« Plusieurs éléments légers ont changé de place entre deux rondes. Aucun intervenant identifié. »\n\nLecture administrative : Erreur de consignation, circulation d’animaux ou déplacement accidentel du matériel.\n\nRELEVÉ C — BRUITS ET MARQUAGES\n\n« Percussions intermittentes dans les conduits ; dessins spiralés signalés sur certaines parois. »\n\nLecture administrative : Résonances géologiques et dépôts minéraux. Aucune intention attribuable avec certitude.\n\nIII. RISQUE ET CONSIGNES POUR LE PERSONNEL\nÉviter les interventions susceptibles de provoquer un affolement.\n\nNe pas tenter de capture ni de contact direct sans protocole scientifique dûment accrédité.\n\nConsigner les observations datées et les pertes d’équipement dans le journal standard ; ne pas substituer des interprétations comportementales à un relevé factuel.\n\nIV. CONCLUSION RÉGLEMENTAIRE\n\nAucun élément recevable ne permet de qualifier les “Skrigs” d’espèce sentiente ni de menace stratégique. Aucun décès humain n’est formellement imputé à cette faune dans le présent dossier.\n\nLes récits d’« intentions », de « messages » ou de « guets-apens » sont exclus de la synthèse faute de preuves répondant aux standards impériaux.\n\nLes prescriptions générales de sécurité demeurent applicables.\nMENTION DE CLÔTURE\n\nLes transcriptions non normalisées et les annexes de réexamen ne sont pas accessibles depuis cette notice. Classification maintenue sous réserve de nouveaux relevés validés.\n\nDernière consultation : Boril (Capt.)"}, {"name": "0078 - Réexamen journaux Mine 312 (Skrigs)", "users": ["SIGMA", "KHAMSIN", "OMEGA22"], "body": "Mine 312  •  Réexamen de certains journaux d’exploitation\nACCREDITATION NIVEAU 2\nCONSULTATION AUTORISÉE SELON DIRECTIVE CSI-47-R/OBF\nRéférence : IMP-XENO-OI/Σ-77 /\n\nSource : Journal d’exploitation de la mine 312 ; fragments pré-impériaux et relectures ultérieures\n\nStatut : EXPURGÉ / RÉVISÉ — CONSULTATION LIMITÉE AUX PERSONNELS ACCRÉDITÉS\n\nObjet : Écarts entre témoignages miniers, relevés instrumentaux et conclusion officielle\n\nI. PORTÉE DE LA RÉVISION\n\nLa source principale est un journal d’exploitation minière, non un programme d’observation biologique. Les opérateurs décrivaient des incidents techniques, rarement des comportements d’animaux. Plusieurs entrées ont été fusionnées ou déclassées ; leurs codes temporels sont partiellement illisibles. Les extraits conservés ne permettent pas de reconstituer une chronologie exhaustive.\n\nII. OBSERVATIONS ANTÉRIEURES À LA FERMETURE DE LA MINE\nFRAGMENT J-12 — LUMIÈRE ET RETRAIT\n\n« Les silhouettes ont disparu à l’allumage du projecteur principal. Une présence est signalée de nouveau à la limite du secteur après extinction des lampes. »\n\nLecture administrative : Réaction à la lumière plausible ; la répétition du phénomène n’a pas été étudiée en conditions contrôlées.\n\nFRAGMENT J-27 — MATÉRIEL DÉPLACÉ\n\n« Deux outils manquants ont été retrouvés au débouché d’un passage latéral, à proximité de pierres disposées selon un motif répété. »\n\nLecture administrative : Le déplacement sélectif est rapporté par l’équipe ; aucun auteur du déplacement n’a été identifié.\n\nFRAGMENT J-39 — SIGNAUX RÉPÉTÉS\n\n« Trois impacts rapprochés, puis une série analogue perçue plus loin. Quelques instants après, déplacement de plusieurs formes vers la galerie adjacente. »\n\nLecture administrative : Les capteurs de l’époque ne distinguaient pas une émission intentionnelle d’un phénomène d’écho. Le rapprochement des événements demeure inexpliqué.\n\nFRAGMENT J-44 — PERTURBATION DES CHANTIERS\n\n« Après une intervention bruyante et l’emploi de fumée, le secteur est demeuré calme. Les signalements ont repris lors des rondes suivantes, dans des passages plus profonds. »\n\nLecture administrative : L’absence apparente d’activité ne prouve ni disparition ni élimination de la population observée.\n\nIII. ÉLÉMENTS RETIRÉS DE LA NOTICE INTERNE\n\nMarquages géométriques décrits à plusieurs endroits, dont certains motifs présenteraient des répétitions non explicables par un simple dépôt aléatoire.\n\nPertes d’équipement portant principalement sur de petits objets manipulables ; les registres ne permettent pas d’établir s’il s’agit de vols, de déplacements accidentels ou d’erreurs humaines.\n\nSignalements simultanés de silhouettes dans des passages distincts, sans parcours humain direct clairement identifié entre ces points.\n\nIncidents de sécurité regroupés administrativement avec des accidents miniers ordinaires. Aucune expertise conservée ne permet d’en attribuer avec certitude la cause aux Skrigs.\n\nIV. HYPOTHÈSES NON HOMOLOGUÉES\n\nDes observateurs ont suggéré que les manifestations puissent répondre à l’éclairage, au bruit et à la présence persistante des équipes. Quelques notes évoquent une forme de coordination entre individus. Ces hypothèses ne sont ni établies ni réfutées par les relevés disponibles.\n\nUn feuillet non signé conserve la formule : « Ils n’attaquent pas immédiatement. Ils attendent. » Un autre fragment évoque « un rythme » sans indication de méthode ni de signification. Les deux passages ont été exclus de la synthèse de niveau 1 comme interprétations non vérifiables.\n\nLa présence éventuelle d’une organisation sociale, d’une mémoire des parcours ou d’un système de signaux ne peut être déduite de ces seuls fragments. Réciproquement, l’absence de technologie industrielle ne suffit pas, en soi, à établir l’absence de comportement élaboré.\n\nV. SECTEURS ET ARCHIVES INACCESSIBLES\n\nLes registres distinguent les galeries d’exploitation des passages naturels plus profonds. Certaines références géologiques n’ont pas été reportées dans les plans administratifs postérieurs à la fermeture de la mine. Une branche profonde est désormais condamnée ; son ancienne documentation technique n’est pas jointe à cette annexe.\n\nPlusieurs relevés environnementaux y sont mentionnés, mais les champs relatifs à la nature des prélèvements ont été expurgés. Aucune conclusion biologique ne peut être tirée de ces mentions. L’accès à la zone reste soumis aux restrictions générales du site.\n\nVI. NOTE FINALE DE RÉEXAMEN\n\nLa qualification « faune cavernicole non sentiente » est maintenue à titre administratif, faute d’un programme d’étude reconnu. Le présent dossier indique seulement que les éléments rejetés ne sont pas tous insignifiants. Leur interprétation requiert des observations répétées, datées et reproductibles plutôt qu’une extrapolation à partir de témoignages isolés.\n\nEn cas d’observation nouvelle : privilégier le relevé à distance, noter précisément l’éclairage, les émissions sonores, les déplacements d’objets et la succession des manifestations. Tout signalement doit rester factuel. Aucune tentative de capture n’est autorisée par ce dossier.\n\nMENTION DE CLÔTURE\n\nL’existence d’une archive ne constitue pas une attestation de la véracité de toutes les déclarations qu’elle contient.\n\nDernière consultation : Boril (Capt.)"}, {"name": "0318 - Maintenance cuve CVD-44", "users": [], "body": "CENTRE DE RECHERCHES D’OÏMIAKON\nSECTION DE MAINTENANCE\nACCREDITATION NIVEAU 1\nMATERIEL : CUVE CVD-44\nDETAIL : cuve de distillation grand format CVD-44 (matricule BT-06-CT/44).\nHistorique des interventions : an 20 à an 22.\n\nAn 20, jour 273 — Staylen. Contrôle périodique du corps de cuve, des raccords et des joints. L’état général correspond à un équipement déjà ancien, mais aucune perte d’étanchéité continue n’est constatée au régime de vérification habituel. Un léger marquage est relevé au niveau du joint principal. Nettoyage et vérification des serrages. Statut : maintien en service.\n\nAn 20, jour 331 — Staylen. Temps de stabilisation légèrement plus long après les cycles de rinçage. Vérification de la mesure de pression et recalage du capteur secondaire. Les valeurs reviennent dans la plage attendue au régime d’essai. L’évolution du temps de stabilisation est conservée pour comparaison lors de la prochaine intervention. Statut : en service.\n\nAn 21, jour 041 — Staylen. Début de jeu sur plusieurs fixations de la couronne d’assemblage, corrigé par resserrage. Le joint principal ne présente pas de rupture visible, mais sa souplesse est moindre que lors des contrôles précédents. Remplacement conseillé lors d’une révision programmée, sans immobilisation immédiate. Statut : en service.\n\nAn 21, jour 112 — Staylen. Variation de pression en fin de montée, sans franchissement du seuil d’arrêt automatique. Test de la sonde et du circuit de lecture. Le signal est régulier à pression constante, plus instable lors des changements rapides de régime. Aucun composant principal remplacé. Statut : en service.\n\nAn 21, jour 178 — Staylen. Nouvelle inspection des joints après une période d’utilisation prolongée. Une trace intermittente apparaît au raccord principal en fin de séquence, puis disparaît à l’arrêt. Le serrage est repris et un contrôle à faible régime est jugé satisfaisant. La remise à neuf du joint principal est maintenue au programme d’entretien. Statut : en service.\n\nAn 21, jour 246 — Staylen. Les variations de pression deviennent plus fréquentes au redémarrage. Le joint principal présente désormais des signes d’usure visibles sur son pourtour et des traces de suintement après plusieurs cycles. La cuve passe toutefois l’essai de tenue au régime ordinaire. Demande de remplacement du joint reconduite. Statut : en service sous surveillance.\n\nAn 21, jour 309 — Staylen. Contrôle comparatif avec la visite précédente. Les resserrages effectués réduisent momentanément les écarts de pression, sans les supprimer dans les phases de transition. Le remplacement du joint principal n’a pas encore été réalisé. La décision est de poursuivre les cycles ordinaires en attendant le créneau de réparation, déjà demandé. Statut : en service sous surveillance.\n\nAn 22, jour 034 — Staylen. Écart de pression au premier cycle de la journée, puis valeurs régulières après stabilisation. L’essai bref ne révèle pas de fuite persistante, mais confirme une dégradation lente de l’étanchéité au niveau de l’assemblage principal. Une intervention plus longue est prévue pour démonter le joint et vérifier sa portée. Statut : en service sous surveillance.\n\nAn 22, jour 057 — Staylen. Nouvelle mesure du temps de stabilisation : durée supérieure aux références initiales. La cuve reste exploitable aux régimes habituels, mais la marge de sécurité de l’assemblage ne peut plus être appréciée par le seul essai court. Le démontage du joint principal demeure nécessaire pour conclure. Statut : en service sous surveillance.\n\nAn 22, jour 072 — Staylen. Inspection visuelle du joint principal après rinçage. La surface d’appui est marquée et l’élasticité de la garniture paraît diminuée. Nettoyage et contrôle des fixations effectués. Aucun remplacement, la pièce de rechange n’étant pas encore installée. Test ordinaire concluant à une tenue provisoire, sans attester la résistance à des contraintes supérieures. Statut : en service sous surveillance.\n\nAn 22, jour 086 — Staylen. L’appareil demande un temps d’équilibrage plus long que lors des premiers contrôles. Les points de mesure confirment une légère perte de stabilité au cours des changements de régime. Le comportement redevient acceptable après stabilisation. Réparation de l’étanchéité principale toujours programmée, non achevée. Statut : en service avec réserve confirmée.\n\nAn 22, jour 099 — Staylen. Test après nettoyage complet. Les relevés sont satisfaisants à faible sollicitation, mais une irrégularité se reproduit lorsque la pression évolue rapidement. Une première vérification des capteurs écarte un défaut de lecture simple. Le joint principal demeure la cause technique la plus probable. Statut : en service avec réserve confirmée.\n\nAn 22, jour 111 — Staylen. Contrôle des fixations et de la portée du joint. Le resserrage produit une amélioration limitée à court terme. L’inspection confirme que les surfaces de contact ne présentent plus la même régularité que lors des premières années de service. Une remise en état durable exige une intervention complète, pas un nouveau réglage. Statut : en service avec réserve confirmée.\n\nAn 22, jour 123 — Staylen. Apparition de traces d’humidité plus nettes au raccord principal après un cycle prolongé. Le phénomène s’atténue au refroidissement ; aucune fuite permanente n’est constatée à l’arrêt. La cuve satisfait toujours l’essai courant prévu pour l’exploitation habituelle. Réserve sur les cycles sollicitant fortement l’étanchéité. Statut : en service avec réserve confirmée.\n\nAn 22, jour 134 — Staylen. Contrôle intermédiaire demandé en raison de la récurrence des écarts. Le joint principal doit être remplacé ; il ne s’agit plus d’un simple réglage conseillé. Les contrôles disponibles ne démontrent pas une rupture immédiate, mais ne permettent pas de garantir la tenue pour des séquences inhabituelles. Statut : en service avec réserve confirmée.\n\nAn 22, jour 142 — Staylen. Vérification de suivi. Le défaut d’étanchéité se manifeste par intermittence et la stabilité de pression se dégrade progressivement. Les corrections de serrage deviennent moins efficaces. Statut : en service avec réserve confirmée.\n\nAn 22, jour 148 — Staylen. Réévaluation de la cuve avant intervention programmée. Défaut au joint principal toujours présent, avec traces de suintement et réponse irrégulière lorsque la pression varie. L’appareil est encore utilisé selon les séquences ordinaires ; cette utilisation ne constitue pas une attestation d’aptitude à un procédé different! Réparation demandée et non close. Statut : en service avec réserve persistante.\n\nAn 22, jour 151 — Staylen. Contrôle technique faisant suite aux réserves précédentes. Le maintien du fonctionnement courant ne doit pas être confondu avec la résolution du défaut. Les mesures de routine restent dans les seuils tolérés, malgré des écarts répétés. Statut : contrôle approfondi en cours.\n\nAn 22, jour 154 — Staylen. Fragilité d’étanchéité toujours observée au joint principal. Remplacement déclaré nécessaire et non effectué pour défaut de disponibilité des pieces de rechange ; intervention corrective en attente de livraison. Statut : hors service.\n\nFin de l’extrait du journal d’entretien."}, {"name": "0527 - Historique des prêts du droïde O-pi12", "users": [], "body": "CENTRE DE RECHERCHES D’OÏMIAKON\nNIVEAU D’ACCREDITATION 1\nJOURNAL AUTOMATISÉ DES AFFECTATIONS\nÉquipement : Droïde O-π12\nLaboratoire de rattachement : Cybernétique\nPériode extraite : an 22, J068 à J169\n\nDate | Heure | Laboratoire d’origine | Laboratoire destinataire | Validation | Enregistrement\nJ068 | 08:20 | Cybernétique → Mécanique | Nicx | Prêt temporaire\nJ073 | 11:42 | Mécanique → Cybernétique | Nicx | Retour\nJ080 | 07:55 | Cybernétique → Bio-technologie | Nicx | Prêt temporaire\nJ086 | 21:03 | Bio-technologie → Cybernétique | Nicx | Retour\nJ098 | 06:40 | Cybernétique → Pharmacologie | Nicx | Prêt temporaire\nJ105 | 12:06 | Pharmacologie → Cybernétique | Nicx | Retour\nJ111 | 14:28 | Cybernétique → Mécanique | Nicx | Prêt temporaire\nJ118 | 19:20 | Mécanique → Cybernétique | Nicx | Retour\nJ124 | 07:43 | Cybernétique → Épidémiologie | Nicx | Prêt temporaire\nJ133 | 18:05 | Épidémiologie → Cybernétique | Nicx | Retour\nJ140 | 16:50 | Cybernétique → Bio-technologie | Nicx | Prêt temporaire\nJ149 | 16:42 | Bio-technologie → Cybernétique | Nicx | Retour\nJ157 | 10:50 | Cybernétique → Xéno-biotechnologie | Nicx | Prêt temporaire\nJ161 | 09:52 | Xéno-biotechnologie → C ins de leur service doivent respecter le circuit d’autorisation prévu au règlement intérieur du C.R.O. La commission recommande de ne pas multiplier les copies de synthèse de l’affaire 341Y et de privilégier la présente conclusion lors des échanges administratifs courants concernant le décès du capitaine Boril.\n\nEffet sur les archives\n\nLes pièces originales conservées par leurs services respectifs ne sont pas fusionnées dans le présent rapport. Le fait de ne pas les reproduire dans ce rapport n’en annule ni l’existence ni les conditions ordinaires de conservation. Leur consultation éventuelle demeure une démarche distincte, soumise aux règles applicables à chacune des sources concernées.\n\nConclusion\n\nSur la base de la qualification retenue, la commission propose de classer le dossier comme « décès accidentel par inhalation de spores toxiques lors d’un prélèvement ; événement imprévisible, sans responsabilité humaine établie ». L’affaire 341Y peut être close du point de vue de la procédure interne. Les obligations générales de sécurité scientifique restent applicables, et les services poursuivent leurs missions sans que le présent document institue une dérogation particulière à la hiérarchie ou à la confidentialité.\n\nSignatures numériques de clôture : capitaine Vadric ; capitaine Machka.\n\nRapport classifié niveau 2, consultation soumise aux habilitations et procédures en vigueur."}], "analyses": [{"name": "012343 - résultat chimie", "users": [], "body": "RÉSULTAT D'ANALYSE — CHIMIE\nÉCHANTILLON : 012343\n\n[EXEMPLE PROVISOIRE — À REMPLACER]\n\nCOMPOSITION :\n  Eau ................. 71,2 %\n  Silicates ........... 18,4 %\n  Composés organiques .. 9,9 %\n  Traces non identifiées 0,5 %\n\nCONCLUSION : échantillon non conforme aux références du C.R.O."}, {"name": "014872 - résultat biologie", "users": [], "body": "RÉSULTAT D'ANALYSE — BIOLOGIE\nÉCHANTILLON : 014872\n\n[EXEMPLE PROVISOIRE — À REMPLACER]\n\nPrésence de spores détectée.\nConcentration : élevée\n const screen = document.getElementById('screen');
const out = document.getElementById('out');
const kb = document.getElementById('kb');

const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const toBottom = () => { screen.scrollTop = screen.scrollHeight; };
const mk = (cls, txt) => {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = txt;
  return s;
};

// Stockage persistant (localStorage), avec repli en mémoire si indisponible (file:// sur iOS).
const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
};

let printing = false;
let skipFlag = false;

function line(text = '', cls = '', into = out) {
  const d = document.createElement('div');
  d.className = 'ln' + (cls ? ' ' + cls : '');
  d.textContent = text === '' ? '\u00a0' : text;
  into.appendChild(d);
  toBottom();
  return d;
}

// Affiche des lignes une à une (effet machine). Toute touche accélère l'affichage.
async function print(lines, { delay = 14, cls = '', into = out } = {}) {
  if (!Array.isArray(lines)) lines = String(lines).split('\n');
  printing = true; skipFlag = false;
  for (const l of lines) {
    line(l, cls, into);
    if (delay && !skipFlag) await sleep(delay);
  }
  printing = false;
}

async function progress(label, ms = 1500) {
  const N = 30;
  const d = line('');
  printing = true; skipFlag = false;
  for (let i = 0; i <= N; i++) {
    d.textContent = `${label} [${'#'.repeat(i)}${'.'.repeat(N - i)}] ${Math.round(i / N * 100)}%`;
    toBottom();
    if (!skipFlag) await sleep(ms / N);
  }
  printing = false;
}

const clear = () => { out.innerHTML = ''; screen.scrollTop = 0; };

function banner(title, desc) {
  const w = Math.min(Math.max(title.length, 40) + 4, 76);
  const bar = '='.repeat(w);
  return [bar, ' ' + title, bar, ' ' + desc, ''];
}

/* ==========================================================================
   ENTRÉES (clavier uniquement)
   ========================================================================== */

let reader = null; // consommateur d'entrée actif : { onkey(e), render() }
let gate = null;   // écran "appuyez sur une touche"

/* Plein écran sans chrome Safari. Doit être appelé depuis un geste utilisateur.
   - iPad Safari : seule l'API préfixée webkit* existe.
   - Écran d'accueil (standalone) : déjà sans chrome, rien à faire.
   - iPhone Safari : pas d'API plein écran pour les éléments, on ignore. */
const IS_FXIOS = /FxiOS/.test(navigator.userAgent);
if (IS_FXIOS) document.documentElement.classList.add('fx-scroll');

function goFullscreen() {
  if (navigator.standalone) return;
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    const p = req.call(el, { navigationUI: 'hide' });
    if (p && p.catch) p.catch(() => {});
  } catch (_) {}
}

function readLine({ prompt = '> ', mask = false, history = null, complete = null, max = 0 } = {}) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'ln';
    const a = mk('', ''), c = mk('caret', ''), b = mk('', '');
    row.append(mk('', prompt), a, c, b);
    out.appendChild(row);
    kb.value = '';
    if (max) kb.maxLength = max; else kb.removeAttribute('maxlength');
    let hi = history ? history.length : 0;
    let draft = '';

    const disp = s => (mask ? '*'.repeat(s.length) : s.toUpperCase());
    const render = () => {
      const v = kb.value;
      const pos = Math.min(kb.selectionStart == null ? v.length : kb.selectionStart, v.length);
      const d = disp(v);
      a.textContent = d.slice(0, pos);
      c.textContent = d[pos] || '\u00a0';
      b.textContent = d.slice(pos + 1);
      toBottom();
    };
    const finish = val => {
      reader = null;
      row.textContent = prompt + disp(kb.value);
      kb.value = '';
      resolve(val);
    };
    const setValue = v => { kb.value = v; const n = v.length; kb.setSelectionRange(n, n); render(); };

    reader = {
      render,
      onkey(e) {
        switch (e.key) {
          case 'Enter': {
            const v = kb.value;
            if (history && v.trim() && !mask && history[history.length - 1] !== v) history.push(v);
            finish(v);
            return true;
          }
          case 'Escape': finish(null); return true;
          case 'ArrowUp':
            if (history && hi > 0) { if (hi === history.length) draft = kb.value; setValue(history[--hi]); }
            return true;
          case 'ArrowDown':
            if (history && hi < history.length) { hi++; setValue(hi === history.length ? draft : history[hi]); }
            return true;
          case 'Tab':
            if (complete) { const r = complete(kb.value); if (r) setValue(r); }
            return true;
        }
        return false;
      },
    };
    render();
  });
}

const BACK = Symbol('back');

// Choix multiple au clavier : ↑/↓ + Entrée, ou touche chiffre. Renvoie un index, BACK ou null (Échap).
function choose(labels, { allowBack = false } = {}) {
  return new Promise(resolve => {
    let sel = 0;
    const rows = labels.map(() => {
      const d = document.createElement('div');
      d.className = 'ln opt';
      out.appendChild(d);
      return d;
    });
    const draw = () => rows.forEach((d, i) => {
      d.textContent = `${i === sel ? '>' : ' '} [${i + 1}] ${labels[i]}`;
      d.classList.toggle('sel', i === sel);
    });
    const done = v => {
      reader = null;
      rows.forEach((d, i) => {
        d.classList.remove('sel');
        d.textContent = `  ${typeof v === 'number' && i === v ? '[X]' : '[ ]'} ${labels[i]}`;
      });
      resolve(v);
    };
    reader = {
      render() {},
      onkey(e) {
        if (e.key === 'ArrowUp') { sel = (sel + labels.length - 1) % labels.length; draw(); return true; }
        if (e.key === 'ArrowDown') { sel = (sel + 1) % labels.length; draw(); return true; }
        if (e.key === 'Enter') { done(sel); return true; }
        if (e.key === 'Escape') { done(null); return true; }
        if (e.key === 'ArrowLeft' && allowBack) { done(BACK); return true; }
        if (/^[1-9]$/.test(e.key) && +e.key <= labels.length) { sel = +e.key - 1; draw(); done(sel); return true; }
        return true; // ignore toute autre touche
      },
    };
    draw();
    toBottom();
  });
}

let viewerOpen = false;

// Visionneuse paginée : seul ce qui tient à l'écran est visible ; ↑/↓ font défiler jusqu'à la fin.
async function view(title, text, endLabel = 'FIN DU DOCUMENT') {
  const lines = Array.isArray(text) ? text : String(text).split('\n');
  viewerOpen = true;
  vhead.textContent = title;
  vbody.textContent = '';
  vbody.style.flex = '1';
  vbody.style.height = '';
  screen.style.visibility = 'hidden';
  viewer.hidden = false;

  // Hauteur de la fenêtre = nombre entier de lignes. Recalculée si l'écran change de taille
  // (rotation, barre Safari, clavier virtuel…).
  let lh = 24, rows = 3, maxTop = 0, top = 0;
  const measure = () => {
    vbody.style.flex = '1';
    vbody.style.height = '';
    lh = parseFloat(getComputedStyle(vbody).lineHeight) || 24;
    rows = Math.max(3, Math.floor(vbody.clientHeight / lh));
    vbody.style.flex = 'none';
    vbody.style.height = rows * lh + 'px';
    maxTop = Math.max(0, Math.round(vbody.scrollHeight / lh) - rows);
    top = Math.min(top, maxTop);
  };
  const draw = () => {
    vbody.scrollTop = top * lh;
    const pct = maxTop ? Math.round(top / maxTop * 100) : 100;
    vfoot.textContent = top >= maxTop
      ? ` ${endLabel} — ÉCHAP OU ENTRÉE POUR FERMER`
      : ` ↑↓ DÉFILER · ESPACE PAGE SUIVANTE · ÉCHAP FERMER · ${String(pct).padStart(3)}%`;
  };
  measure();

  // La première page s'affiche ligne à ligne ; le reste est chargé hors écran.
  printing = true; skipFlag = false;
  for (const l of lines) {
    const d = document.createElement('div');
    d.className = 'ln';
    d.textContent = l === '' ? '\u00a0' : l;
    vbody.appendChild(d);
    if (!skipFlag && vbody.scrollHeight <= vbody.clientHeight + 1) await sleep(22);
  }
  printing = false;

  measure();
  draw();
  const onResize = () => { measure(); draw(); };
  window.addEventListener('resize', onResize);
  await new Promise(resolve => {
    reader = {
      pager: true,
      render() {},
      onkey(e) {
        const k = e.key;
        if (k === 'ArrowDown') top = Math.min(maxTop, top + 1);
        else if (k === 'ArrowUp') top = Math.max(0, top - 1);
        else if (k === 'PageDown' || k === ' ') top = Math.min(maxTop, top + rows - 1);
        else if (k === 'PageUp') top = Math.max(0, top - rows + 1);
        else if (k === 'Home') top = 0;
        else if (k === 'End') top = maxTop;
        else if (k === 'Escape' || k === 'q' || k === 'Q' || (k === 'Enter' && top >= maxTop)) {
          reader = null; resolve(); return true;
        }
        else if (k === 'Enter') top = Math.min(maxTop, top + rows - 1);
        else return true;
        draw();
        return true;
      },
    };
  });
  window.removeEventListener('resize', onResize);
  viewer.hidden = true;
  viewerOpen = false;
  screen.style.visibility = '';
  toBottom();
}

/* ==========================================================================
   ÉVÉNEMENTS CLAVIER
   ========================================================================== */

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  if (document.activeElement !== kb) kb.focus();
  if (gate) { e.preventDefault(); goFullscreen(); gate(); return; }
  if (!viewerOpen && e.key === 'PageUp') { screen.scrollBy({ top: -screen.clientHeight * 0.8 }); e.preventDefault(); return; }
  if (!viewerOpen && e.key === 'PageDown') { screen.scrollBy({ top: screen.clientHeight * 0.8 }); e.preventDefault(); return; }
  if (printing) { skipFlag = true; e.preventDefault(); return; }
  if (!reader) { e.preventDefault(); return; }
  if (reader.onkey(e)) e.preventDefault();
  requestAnimationFrame(() => reader && reader.render());
});
kb.addEventListener('input', () => reader && reader.render());
document.addEventListener('selectionchange', () => reader && reader.render());
document.addEventListener('click', () => { kb.focus(); goFullscreen(); if (gate) gate(); });
document.addEventListener('touchend', () => { goFullscreen(); if (gate) gate(); });

const isPublic = doc => !doc.users || !doc.users.length;
const canAccess = (doc, id) => isPublic(doc) || doc.users.some(u => norm(u) === id);

// Chaque consultation d'un document protégé redemande l'identifiant : aucune session n'est mémorisée.
async function authorize(doc) {
  if (isPublic(doc)) return true;
  await print(['', 'DOCUMENT PROTÉGÉ — IDENTIFIANT AUTORISÉ REQUIS'], { delay: 0 });
  for (let t = 1; t <= 3; t++) {
    const code = await readLine({ prompt: "CODE D'ACCÈS > ", mask: true });
    if (code === null) { await print('ACCÈS ANNULÉ.'); return false; }
    if (canAccess(doc, norm(code))) {
      await print('CODE ACCEPTÉ. ACCÈS AUTORISÉ.');
      return true;
    }
    await print(`CODE INVALIDE (${t}/3)`, { cls: 'inv' });
  }
  await print('ACCÈS REFUSÉ. INCIDENT ENREGISTRÉ.', { cls: 'inv' });
  return false;
}

// Demande un identifiant (saisie masquée) et le renvoie (normalisé) s'il figure dans au moins un document, sinon null.
async function askUserId() {
  for (let t = 1; t <= 3; t++) {
    const code = await readLine({ prompt: "CODE D'ACCÈS > ", mask: true });
    if (code === null) { await print('ACCÈS ANNULÉ.'); return null; }
    const n = norm(code);
    if (n && DATA.documents.some(f => !isPublic(f) && canAccess(f, n))) {
      await print('CODE ACCEPTÉ. ACCÈS AUTORISÉ.');
      return n;
    }
    await print(`CODE INVALIDE (${t}/3)`, { cls: 'inv' });
  }
  await print('ACCÈS REFUSÉ. INCIDENT ENREGISTRÉ.', { cls: 'inv' });
  return null;
}

const isAlnum = ch => ch !== undefined && /[a-z0-9]/.test(ch);

// Le nom du fichier doit commencer par la saisie (sur une frontière de mot).
function findFiles(list, q, { titleFallback = false } = {}) {
  const n = norm(q);
  if (!n) return [];
  let m = list.filter(f => { const fn = norm(f.name); return fn.startsWith(n) && !isAlnum(fn[n.length]); });
  if (!m.length && titleFallback && n.length >= 4) {
    m = list.filter(f => norm(f.name.split(' - ').slice(1).join(' - ')).includes(n));
  }
  return m;
}

const isQuit = s => ['q', 'quit', 'quitter', 'exit', 'sortir', 'retour'].includes(norm(s));
const QUIT_HINT = '(ÉCHAP ou QUITTER pour revenir au terminal)';

const labelOf = o => (typeof o === 'string' ? o : o.label);

// Pose les questions une à une. ← revient en arrière. Renvoie les index de réponse, ou null si annulé.
// Une question (ou une option) avec `follow: { prompt }` demande ensuite une saisie libre, renvoyée dans `answers.texts[i]`.
// Une question avec `free: { prompt }` (sans options) n'est qu'une saisie libre.
// Une question avec `when: answers => bool` n'est posée que si la condition est vraie (sinon sautée).
async function runSurvey(questions) {
  const answers = new Array(questions.length).fill(null);
  answers.texts = new Array(questions.length).fill(null);
  const marks = [];
  const active = j => !questions[j].when || questions[j].when(answers);
  let i = 0;
  line('↑↓ choisir · ENTRÉE valider · 1-9 choix direct · ← question précédente · ÉCHAP annuler', 'dim');
  while (i < questions.length) {
    if (!active(i)) { answers[i] = null; answers.texts[i] = null; i++; continue; }
    marks[i] = out.childElementCount;
    const q = questions[i];
    let nth = 0, total = 0;
    questions.forEach((_, j) => { if (active(j)) { total++; if (j <= i) nth++; } });
    await print(['', `QUESTION ${nth}/${total}`, q.text, ''], { delay: 0 });
    if (q.free) {
      let t = '';
      while (!t) {
        const v = await readLine({ prompt: q.free.prompt });
        if (v === null) return null;
        t = v.trim();
      }
      answers[i] = 0;
      answers.texts[i] = t;
      i++;
      continue;
    }
    const r = await choose(q.options.map(labelOf), { allowBack: i > 0 });
    if (r === null) return null;
    if (r === BACK) {
      i--;
      while (!active(i)) i--;
      while (out.childElementCount > marks[i]) out.lastChild.remove();
      continue;
    }
    answers[i] = r;
    const follow = q.follow || q.options[r].follow;
    if (follow) {
      line('');
      let t = '';
      while (!t) {
        const v = await readLine({ prompt: follow.prompt });
        if (v === null) return null;
        t = v.trim();
      }
      answers.texts[i] = t;
    }
    i++;
  }
  return answers;
}

const RAPPORT_KEY = 'cro.rapport';
const RAPPORT_DRAFT = 'cro.rapport.draft';
const BAR = '='.repeat(60);

const rapportInfraction = code => {
  for (const cat of RAPPORT.categories) {
    const inf = cat.infractions.find(x => x.code === code);
    if (inf) return { cat, inf };
  }
  return null;
};

// Lignes de signalement au-delà de `perInfraction` pour un même code : elles occupent les « compléments ».
const supplementsUsed = entries => {
  const seen = {};
  let used = 0;
  entries.forEach(e => { seen[e.code] = (seen[e.code] || 0) + 1; if (seen[e.code] > RAPPORT.perInfraction) used++; });
  return used;
};

function rapportStats(entries) {
  const cats = RAPPORT.categories.map(cat => {
    const n = entries.filter(e => rapportInfraction(e.code).cat === cat).length;
    return { cat, n, pts: n * cat.points };
  });
  return { cats, count: entries.length, total: cats.reduce((s, c) => s + c.pts, 0) };
}

function rapportBilan(stats) {
  const w = (s, n) => String(s).padEnd(n);
  return [
    `${w('CATÉGORIE', 16)}${w('SIGNALEMENTS', 14)}${w('PTS/SIGN.', 11)}SOUS-TOTAL`,
    ...stats.cats.map(c => `${w(c.cat.name.toUpperCase(), 16)}${w(c.n, 14)}${w(c.cat.points, 11)}${c.pts}`),
    `${w('TOTAL', 16)}${w(stats.count, 14)}${w('—', 11)}${stats.total}`,
  ];
}

const entryLines = (e, indent = '  ') => {
  const l = [`${indent}- ${e.person.toUpperCase()}`];
  if (e.witnesses) l.push(`${indent}  Témoins : ${e.witnesses.toUpperCase()}`);
  if (e.details) l.push(`${indent}  Précisions : ${e.details.toUpperCase()}`);
  return l;
};

const fmtStamp = ts => {
  const d = new Date(ts);
  return `${d.toLocaleDateString('fr-FR')} À ${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
};

function reportLines(rep) {
  const stats = rapportStats(rep.entries);
  const lines = [BAR, ` ${RAPPORT.title.toUpperCase()}`, ` RÉF. ${rep.ref}  —  STATUT : TRANSMIS (LECTURE SEULE)`,
    ` DÉPOSÉ LE ${fmtStamp(rep.ts)}`, BAR, ''];
  RAPPORT.categories.forEach(cat => {
    const mine = rep.entries.filter(e => rapportInfraction(e.code).cat === cat);
    if (!mine.length) return;
    lines.push(`CATÉGORIE ${cat.id} — ${cat.label} • ${cat.points} POINT${cat.points > 1 ? 'S' : ''} PAR FAIT`, '');
    cat.infractions.forEach(inf => {
      const list = mine.filter(e => e.code === inf.code);
      if (!list.length) return;
      lines.push(`${inf.code}  ${inf.label}`);
      list.forEach(e => lines.push(...entryLines(e)));
      lines.push('');
    });
  });
  lines.push('BILAN', '', ...rapportBilan(stats), '', 'VISAS DES ASSESSEURS', '');
  rep.visas.forEach(v => lines.push(`  ${v.name} : ${v.visa.toUpperCase()}`));
  lines.push('', BAR, ' FIN DU RAPPORT — AUCUNE MODIFICATION POSSIBLE', BAR);
  return lines;
}

function rapportHeader() {
  return [
    `ÉCHÉANCE DE DÉPÔT : ${RAPPORT.deadline}.`,
    `Objet : ${RAPPORT.object}`,
    `Contexte : ${RAPPORT.context}`,
    `Méthode : ${RAPPORT.method}`,
    '',
    'ASSESSEURS DÉSIGNÉS :',
    ...RAPPORT.assessors.map(a => `  ${a.name} — ${a.by}`),
    '',
    'ÉCHELLE : ' + RAPPORT.categories.map(c => `${c.id} = ${c.points} pt${c.points > 1 ? 's' : ''}`).join(' · ')
      + ` — quota attendu : ${RAPPORT.quota} points ou plus.`,
    `RÈGLE : ${RAPPORT.rule}`,
    '',
  ];
}

const loadDraft = () => {
  try { const d = JSON.parse(store.get(RAPPORT_DRAFT) || '[]'); return Array.isArray(d) ? d.filter(e => rapportInfraction(e.code)) : []; }
  catch (e) { return []; }
};

async function askField(prompt, max, required) {
  for (;;) {
    const v = await readLine({ prompt, max });
    if (v === null) return null;
    const t = v.trim();
    if (t || !required) return t;
  }
}

// Saisie d'un signalement (une ligne du tableau). Échap annule. Renvoie l'entrée ou null.
async function askEntry(code) {
  const M = RAPPORT.max;
  const person = await askField('PERSONNE CONCERNÉE > ', M.person, true);
  if (person === null) return null;
  const witnesses = await askField('TÉMOINS (FACULTATIF) > ', M.witnesses, false);
  if (witnesses === null) return null;
  const details = await askField('PRÉCISIONS (FACULTATIF) > ', M.details, false);
  if (details === null) return null;
  return { code, person, witnesses, details };
}

// Écran d'une infraction : liste des personnes signalées, ajout / suppression.
async function rapportInfractionScreen(cat, inf, entries, save) {
  let notice = '';
  for (;;) {
    clear();
    const mine = entries.filter(e => e.code === inf.code);
    const supp = supplementsUsed(entries);
    await print([`${inf.code} — ${inf.label}`, `CATÉGORIE ${cat.id} • ${cat.points} POINT${cat.points > 1 ? 'S' : ''} PAR FAIT`, ''], { delay: 0 });
    if (mine.length) {
      const l = [];
      mine.forEach((e, i) => { const t = entryLines(e, ''); l.push(`${i + 1}. ${t[0].slice(2)}`, ...t.slice(1).map(x => '   ' + x)); });
      await print(l, { delay: 0 });
    } else {
      line('AUCUN SIGNALEMENT POUR CETTE INFRACTION.', 'dim');
    }
    line('');
    line(`LIGNES PRINCIPALES : ${Math.min(mine.length, RAPPORT.perInfraction)}/${RAPPORT.perInfraction} · COMPLÉMENTS UTILISÉS (TOUS CODES) : ${supp}/${RAPPORT.supplements}`, 'dim');
    if (notice) { line(notice, 'inv'); notice = ''; }
    line('');
    const acts = [['add', 'Signaler une personne']];
    if (mine.length) acts.push(['del', 'Supprimer un signalement']);
    acts.push(['back', 'Retour à la liste des infractions']);
    const r = await choose(acts.map(a => a[1]));
    if (r === null || acts[r][0] === 'back') return;
    if (acts[r][0] === 'add') {
      if (mine.length >= RAPPORT.perInfraction && supp >= RAPPORT.supplements) {
        notice = `REGISTRE COMPLET : ${RAPPORT.perInfraction} LIGNES PRINCIPALES ET ${RAPPORT.supplements} COMPLÉMENTS DÉJÀ UTILISÉS.`;
        continue;
      }
      line('');
      if (mine.length >= RAPPORT.perInfraction) line(`LIGNES PRINCIPALES PLEINES : INSCRIPTION EN COMPLÉMENT DE SIGNALEMENT (${supp + 1}/${RAPPORT.supplements}).`, 'dim');
      const e = await askEntry(inf.code);
      if (!e) { notice = 'SAISIE ANNULÉE. AUCUN SIGNALEMENT AJOUTÉ.'; continue; }
      entries.push(e);
      save();
    } else {
      line('');
      line('QUEL SIGNALEMENT SUPPRIMER ?', 'dim');
      const d = await choose([...mine.map((e, i) => `${i + 1}. ${e.person.toUpperCase()}`), 'Annuler']);
      if (d !== null && d < mine.length) {
        entries.splice(entries.indexOf(mine[d]), 1);
        save();
      }
    }
  }
}

// Liste des infractions d'une catégorie : on saisit le code G pour ouvrir l'infraction.
async function rapportCategoryScreen(cat, entries, save) {
  const hist = [];
  let notice = '';
  for (;;) {
    clear();
    await print([`CATÉGORIE ${cat.id} — ${cat.label} • ${cat.points} POINT${cat.points > 1 ? 'S' : ''} PAR FAIT`,
      `Sanctions prononcées par : ${cat.by.replace(/\.$/, '')}.`,
      'Chaque ligne remplie correspond à une personne signalée au titre de cette infraction.', ''], { delay: 0 });
    await print(cat.infractions.map(inf => {
      const n = entries.filter(e => e.code === inf.code).length;
      return `  ${inf.code}  ${inf.label}${n ? `   [${n}]` : ''}`;
    }), { delay: 0 });
    line('');
    line(`Entrez le code G de l'infraction (ex. ${cat.infractions[0].code}) · RETOUR pour revenir au menu`, 'dim');
    if (notice) { line(notice, 'inv'); notice = ''; }
    const q = await readLine({ prompt: 'CODE G > ', history: hist });
    if (q === null || isQuit(q)) return;
    const m = norm(q).match(/^g?(\d{1,2})$/);
    const code = m && 'G' + m[1].padStart(2, '0');
    const inf = code && cat.infractions.find(x => x.code === code);
    if (!inf) { notice = `CODE « ${q.trim().toUpperCase()} » INCONNU DANS LA CATÉGORIE ${cat.id}.`; continue; }
    await rapportInfractionScreen(cat, inf, entries, save);
  }
}

// Bilan, quota, visas des trois assesseurs et confirmation. Renvoie { rep } ou { msg }.
async function rapportSubmit(entries) {
  const stats = rapportStats(entries);
  clear();
  await print(['BILAN ET VALIDATION COLLÉGIALE', '',
    "Les nombres ci-dessous correspondent aux lignes de signalement effectivement renseignées, sans double comptage d'une même infraction.",
    '', ...rapportBilan(stats), ''], { delay: 0 });
  if (stats.total < RAPPORT.quota) {
    await print([`RAPPORT IRRECEVABLE : QUOTA NON ATTEINT (${stats.total}/${RAPPORT.quota} POINTS).`,
      'COMPLÉTEZ LE REGISTRE AVANT DE PROCÉDER À LA VALIDATION.', ''], { cls: 'inv', delay: 0 });
    await choose(['Retour au menu']);
    return { msg: '' };
  }
  await print(["Déclaration sur l'honneur :",
    'Le collège des assesseurs certifie avoir examiné et qualifié les faits figurant au présent registre. Les signalements retenus ont été approuvés conjointement. Leur transmission ne préjuge pas des décisions de sanction, réservées aux autorités compétentes.',
    ''], { delay: 0 });
  const go = await choose(['Apposer les visas des trois assesseurs', 'Retour au menu']);
  if (go !== 0) return { msg: '' };
  line('');
  line('VISA NUMÉRIQUE DES TROIS ASSESSEURS (saisir votre validation) · ÉCHAP pour annuler', 'dim');
  const visas = [];
  for (const a of RAPPORT.assessors) {
    const v = await askField(`VISA — ${a.name.toUpperCase()} > `, RAPPORT.max.visa, true);
    if (v === null) return { msg: 'VALIDATION ANNULÉE. AUCUN ENVOI EFFECTUÉ.' };
    visas.push({ name: a.name, visa: v });
  }
  await print(['', "ATTENTION : L'ENVOI EST DÉFINITIF ET NE PEUT ÊTRE EFFECTUÉ QU'UNE SEULE FOIS.", "CONFIRMER L'ENVOI ?", ''], { delay: 0 });
  const c = await choose(['OUI — transmettre le rapport', 'NON — annuler']);
  if (c !== 0) return { msg: 'ENVOI ANNULÉ.' };
  return {
    rep: {
      ref: 'CSI-' + Math.floor(Math.random() * 0x10000).toString(16).toUpperCase().padStart(4, '0'),
      ts: new Date().toISOString(),
      entries: entries.map(e => ({ ...e })),
      visas,
    },
  };
}

async function appRapport() {
  clear();
  await print(banner(RAPPORT.title, RAPPORT.desc), { delay: 20 });
  let saved = null;
  try { saved = JSON.parse(store.get(RAPPORT_KEY) || 'null'); } catch (e) { /* ignoré */ }
  if (saved && !Array.isArray(saved.entries)) { store.del(RAPPORT_KEY); saved = null; } // ancien format de formulaire
  if (saved) {
    await print(['RAPPORT DÉJÀ TRANSMIS. UN SEUL ENVOI EST AUTORISÉ.', 'AFFICHAGE DU DOCUMENT EN LECTURE SEULE :', ''], { cls: 'inv' });
    await print(reportLines(saved), { delay: 22 });
    return;
  }

  const entries = loadDraft(); // brouillon conservé entre deux ouvertures du formulaire
  const save = () => store.set(RAPPORT_DRAFT, JSON.stringify(entries));
  let first = true, notice = '';
  for (;;) {
    if (!first) { clear(); await print(banner(RAPPORT.title, RAPPORT.desc), { delay: 0 }); }
    await print(rapportHeader(), { delay: first ? 12 : 0 });
    first = false;
    const stats = rapportStats(entries);
    line(`REGISTRE : ${stats.count} SIGNALEMENT${stats.count > 1 ? 'S' : ''} · ${stats.total}/${RAPPORT.quota} POINTS${stats.total >= RAPPORT.quota ? ' (QUOTA ATTEINT)' : ''}`, 'dim');
    if (notice) { line(notice, 'inv'); notice = ''; }
    line('');
    const labels = [
      ...stats.cats.map(c => `Catégorie ${c.cat.id} — ${c.cat.label.toLowerCase()} (${c.cat.points} pt${c.cat.points > 1 ? 's' : ''}) · ${c.n} signalement${c.n > 1 ? 's' : ''}`),
      'Organigramme du C.R.O.',
      'Bilan, visas et transmission',
      'Quitter (le brouillon est conservé)',
    ];
    const nCat = stats.cats.length;
    const r = await choose(labels);
    if (r === null || r === nCat + 2) {
      await print(['', 'FORMULAIRE FERMÉ. AUCUN ENVOI EFFECTUÉ.' + (entries.length ? ' BROUILLON CONSERVÉ.' : '')], { cls: 'inv' });
      return;
    }
    if (r < nCat) { await rapportCategoryScreen(RAPPORT.categories[r], entries, save); continue; }
    if (r === nCat) {
      clear();
      await print(['ORGANIGRAMME SIMPLIFIÉ', '', 'BUREAU CENTRAL DU C.S.I. (Coruscant)', '  DIRECTEUR DU C.R.O. (COLONEL OÏMIAK)',
        '    LABORATOIRES / SERVICES DU C.R.O.', '', ...RAPPORT.orgchart.map(([u, resp]) => `      ${u.padEnd(24, '.')} ${resp}`), ''], { delay: 0 });
      await choose(['Retour au menu']);
      continue;
    }
    const res = await rapportSubmit(entries);
    if (!res.rep) { notice = res.msg; continue; }
    store.set(RAPPORT_KEY, JSON.stringify(res.rep));
    store.del(RAPPORT_DRAFT);
    await progress('TRANSMISSION', 1800);
    await print(['', 'RAPPORT TRANSMIS AU C.S.I.', ''], { cls: 'inv' });
    await print(reportLines(res.rep), { delay: 22 });
    return;
  }
}

const DROID_ART = String.raw`    ___
   [o_o]
  /|_=_|\
   |   |
  _|   |_`.split('\n');

async function appDroide() {
  clear();
  await print(banner(DROIDE.title, DROIDE.desc), { delay: 20 });
  const answers = await runSurvey(DROIDE.questions);
  if (!answers) { await print(['', 'PROGRAMMATION ANNULÉE.'], { cls: 'inv' }); return; }
  await print('');
  await progress('COMPILATION DES PARAMÈTRES', 2000);
  const squash = s => norm(s).replace(/[^a-z0-9]/g, '');
  const bypass = DROIDE.bypass.some(n => squash(n) === squash(answers.texts[1] || ''));
  const errors = bypass ? [] : answers.flatMap((a, i) => {
    const q = DROIDE.questions[i];
    return [q.options?.[a]?.error, answers.texts[i] && q.check?.(answers.texts[i])];
  }).filter(Boolean);
  if (errors.length) {
    await print(['', 'ÉCHEC DE LA PROGRAMMATION', '', ...errors, '', 'CORRIGEZ LES PARAMÈTRES ET RELANCEZ LA PROCÉDURE.'], { cls: 'inv' });
  } else {
    const bar = '='.repeat(60);
    const rows = [];
    let n = 0;
    answers.forEach((a, i) => {
      const q = DROIDE.questions[i];
      if (a === null) return;
      const t = answers.texts[i];
      const ans = q.free ? t : labelOf(q.options[a]) + (t ? ` — « ${t} »` : '');
      rows.push(`${String(++n).padStart(2)}. ${q.short}`, `    → ${ans}`);
    });
    await print(['', bar, ' RÉSULTATS DE LA PROGRAMMATION', bar, ...rows, bar,
      'TOUS LES PARAMÈTRES SONT CONFORMES AUX DIRECTIVES IMPÉRIALES.',
      'PROGRAMMATION RÉUSSIE.', ''], { delay: 20 });
    let ok = null;
    while (ok === null) {
      const r = await readLine({ prompt: 'APPLIQUER LA NOUVELLE PROGRAMMATION ? (O/N) > ' });
      const n = r === null ? 'n' : norm(r);
      if (n === 'o' || n === 'oui') ok = true;
      else if (n === 'n' || n === 'non') ok = false;
    }
    if (!ok) { await print(['', "APPLICATION ANNULÉE. LE DROÏDE CONSERVE SA PROGRAMMATION ACTUELLE."], { cls: 'inv' }); return; }
    await print('');
    const extra = answers.map((a, i) => DROIDE.questions[i].options?.[a]?.step).filter(Boolean);
    const steps = [...DROIDE.steps];
    steps.splice(-1, 0, ...extra);
    const W = Math.max(...steps.map(s => s[0].length));
    for (let k = 0; k < steps.length; k++) {
      await progress(`${k + 1}/${steps.length} ${steps[k][0].padEnd(W)}`, steps[k][1]);
    }
    await print('');
    await print(['', ...DROID_ART, '', ...DROIDE.success]);
    const outro = answers.flatMap((a, i) => DROIDE.questions[i].options?.[a]?.outro || []);
    if (outro.length) await print(outro);
    const [master, purpose] = [answers.texts[1], answers.texts[2]];
    if (master) await print(`MAÎTRE ENREGISTRÉ : ${master.toUpperCase()}`);
    if (purpose) await print(`FONCTION ENREGISTRÉE : ${purpose.toUpperCase()}`);
    const tags = answers.map((a, i) => DROIDE.questions[i].options?.[a]?.tag).filter(Boolean);
    const ending = DROIDE.endings.find(e => e.all.every(t => tags.includes(t)));
    if (ending) await print(['', ...ending.lines], { delay: 40 });
  }
}

  const d = g.getImageData(0, 0, MASK, MASK).data;
  const m = new Uint8Array(MASK * MASK);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  return (emblemMask = m);
}

const RAMP = ' .:-=+*#%@';
const DEPTH = 0.07;
const LAYERS = [1, 0.66, 0.33, 0, -0.33, -0.66, -1].map(k => k * DEPTH);

function emblemFrame(cols, rows, theta) {
  const M = getEmblemMask();
  const c = Math.cos(theta), s = Math.sin(theta);
  const cc = Math.abs(c) < 0.04 ? (c < 0 ? -0.04 : 0.04) : c;
  const face = 0.4 + 0.6 * Math.abs(c), side = 0.3 + 0.35 * Math.abs(s);
  const last = RAMP.length - 1, nz = LAYERS.length - 1;
  const sub = [0.25, 0.75];
  const lines = [];
  for (let r = 0; r < rows; r++) {
    let row = '';
    for (let q = 0; q < cols; q++) {
      let acc = 0;
      for (const sy of sub) {
        const v = (r + sy) / rows * 2 - 1;
        const my = ((v + 1) / 2 * MASK) | 0;
        for (const sx of sub) {
          const u = (q + sx) / cols * 2 - 1;
          let best = -Infinity, bright = 0;
          for (let k = 0; k <= nz; k++) {
            const z = LAYERS[k];
            const x0 = (u - z * s) / cc; // point du plan de l'emblème qui tombe sur ce pixel
            if (x0 < -1 || x0 > 1) continue;
            if (!M[my * MASK + (((x0 + 1) / 2 * MASK) | 0)]) continue;
            const depth = -x0 * s + z * c;
            if (depth > best) { best = depth; bright = (k === 0 || k === nz) ? face : side; }
          }
          acc += bright;
        }
      }
      row += RAMP[Math.min(last, Math.round(acc / 4 * last))];
    }
    lines.push(row); // pas de rognage : la largeur doit rester constante pour que l'axe ne bouge pas
  }
  return lines.join('\n');
}

// Mesure d'une cellule de caractère (largeur, hauteur de ligne).
function cellSize() {
  const p = document.createElement('div');
  p.className = 'ln';
  p.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
  p.textContent = 'M'.repeat(40);
  out.appendChild(p);
  const r = p.getBoundingClientRect();
  p.remove();
  return { w: (r.width / 40) || 10.8, h: r.height || 24.3 };
}

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMBLEM_T0 = performance.now(); // horloge commune : la rotation reste continue d'un écran à l'autre

// Ajoute un emblème animé à `into`. L'animation s'arrête d'elle-même quand l'élément quitte la page.
function emblem(rows, cols, into = out) {
  if (!window.Path2D) return null;
  const el = document.createElement('div');
  el.className = 'ln art';
  el.style.width = cols + 'ch'; // place réservée : ni l'axe de rotation ni le texte voisin ne bougent
  el.style.minHeight = rows * 1.35 + 'em';
  into.appendChild(el);
  const t0 = EMBLEM_T0;
  const draw = () => {
    const t = reduceMotion ? 0.5 : (performance.now() - t0) / 1000 * 0.9;
    el.textContent = emblemFrame(cols, rows, t);
  };
  try { draw(); } catch (e) { el.remove(); return null; }
  if (!reduceMotion) {
    const id = setInterval(() => {
      if (!el.isConnected) { clearInterval(id); return; }
      if (!viewerOpen) draw();
    }, 80); // ~12 images/s : fluide, mais léger pour le filtre de courbure
  }
  return el;
}

// Dimensionne l'emblème selon l'écran : côte à côte avec le texte si la place le permet.
function emblemLayout(sideMinText = 40) {
  const cell = cellSize();
  const ratio = cell.h / cell.w;
  const availCols = Math.floor(document.getElementById('inner').clientWidth / cell.w);
  const usable = Math.floor(screen.clientHeight * 0.88 / cell.h);
  const maxSide = Math.min(20, usable - 4, Math.floor((availCols - 4 - sideMinText) / ratio));
  if (maxSide >= 14) return { side: true, rows: maxSide, cols: Math.round(maxSide * ratio) };
  const rows = Math.max(8, Math.min(16, Math.floor(usable * 0.42)));
  return { side: false, rows, cols: Math.min(Math.round(rows * ratio), availCols) };
}

async function showEmblem() {
  const L = emblemLayout(0);
  const rows = Math.min(L.rows, 20), cols = Math.round(rows * (L.cols / L.rows));
  line('');
  emblem(rows, cols);
  line('');
}

/* ==========================================================================
   ÉCRAN CATHODIQUE : courbure (distorsion en barillet) + grain
   ========================================================================== */

const WARP_STRENGTH = 0.07; // déplacement max (coins) en fraction de la largeur ; 0 = aucun

const world = document.getElementById('world');
const warpOK = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('filter', 'url(#crtwarp)');

// Carte de déplacement : au centre 0, vers les bords on échantillonne de plus en plus loin
// (r² · direction), ce qui comprime les bords = effet de bombement.
function buildWarpMap() {
  const n = 128;
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const nx = (x + 0.5) / n * 2 - 1, ny = (y + 0.5) / n * 2 - 1;
      const r2 = nx * nx + ny * ny;
      const i = (y * n + x) * 4;
      img.data[i]     = Math.round(127.5 + 127.5 * nx * r2 / 2);
      img.data[i + 1] = Math.round(127.5 + 127.5 * ny * r2 / 2);
      img.data[i + 2] = 128;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}

function layoutWarp() {
  const W = world.clientWidth || window.innerWidth, H = world.clientHeight || window.innerHeight;
  const f = document.getElementById('crtwarp');
  const im = document.getElementById('warpmap');
  f.setAttribute('width', W); f.setAttribute('height', H);
  im.setAttribute('width', W); im.setAttribute('height', H);
  document.getElementById('warpdisp').setAttribute('scale', (W * WARP_STRENGTH).toFixed(1));
}

function setWarp(on) {
  world.classList.toggle('warp', !!on && warpOK);
}

function initCRT() {
  // grain
  const n = 96, c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d'), d = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++) {
    const v = Math.random() * 255;
    d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v;
    d.data[i * 4 + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  document.getElementById('noise').style.backgroundImage = `url(${c.toDataURL('image/png')})`;

  // courbure
  if (!warpOK) return;
  const url = buildWarpMap();
  const im = document.getElementById('warpmap');
  im.setAttribute('href', url);
  im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
  layoutWarp();
  // Le filtre doit toujours avoir la taille réelle de l'écran (rotation, barre Safari, clavier…).
  if (window.ResizeObserver) new ResizeObserver(layoutWarp).observe(world);
  window.addEventListener('resize', layoutWarp);
  window.addEventListener('orientationchange', layoutWarp);
  setWarp(store.get('cro.warp') !== 'off');
}

const COMMANDS = {
  documents: { desc: "Documents du Centre de Recherche d'Oïmiakon", run: appDocuments },
  analyses:  { desc: "Kit d'analyse", run: appAnalyses },
  rapport:   { desc: "Rapport collectif d'autocritique disciplinaire", run: appRapport },
  droide:    { desc: 'Interface de programmation de Droïde', run: appDroide },
};

async function help() {
  const rows = Object.entries(COMMANDS).map(([k, v]) => `  ${k.toUpperCase().padEnd(11)} ${v.desc}`);
  rows.push(`  ${'CLEAR'.padEnd(11)} Efface l'écran`, `  ${'HELP'.padEnd(11)} Affiche cette liste`, `  ${'EXIT'.padEnd(11)} Revient à l'écran de démarrage`);
  await print(['COMMANDES DISPONIBLES :', '', ...rows, '', 'TAB complète · ↑↓ historique · PAGE↑/↓ défilement · ÉCHAP quitte une application · dans un document : ↑↓ défilent, ÉCHAP ferme']);
}

async function boot() {
  clear();
  // Écran de démarrage : emblème tournant centré + invite.
  const cell = cellSize();
  const ratio = cell.h / cell.w;
  const availCols = Math.floor(document.getElementById('inner').clientWidth / cell.w);
  const usable = Math.floor(screen.clientHeight * 0.88 / cell.h);
  const gRows = Math.max(8, Math.min(22, usable - 4, Math.floor(availCols / ratio)));
  const g = document.createElement('div');
  g.className = 'gate-screen';
  out.appendChild(g);
  emblem(gRows, Math.round(gRows * ratio), g);
  line("APPUYEZ SUR UNE TOUCHE POUR INITIALISER LE TERMINAL", 'blink', g);
  if (IS_FXIOS) line('POUR MASQUER LA BARRE DU NAVIGATEUR : FAITES GLISSER LE DOIGT VERS LE HAUT', 'dim', g);
  await new Promise(r => { gate = () => { gate = null; r(); }; });
  clear();
  kb.focus();

  // Emblème tournant (à gauche) + texte de démarrage (à droite, ou dessous sur écran étroit).
  const L = emblemLayout();
  const box = document.createElement('div');
  box.className = 'boot';
  out.appendChild(box);
  emblem(L.rows, L.cols, box);
  const col = document.createElement('div');
  col.className = 'col';
  box.appendChild(col);

  await print(LOGO, { delay: 90, into: col });
  await print(['', "CENTRE DE RECHERCHES D'OÏMIAKON", 'TERMINAL INTERNE — ACCÈS RESTREINT', ''], { delay: 40, into: col });
  for (const s of ['TEST MÉMOIRE ........... 640K OK', 'LIAISON RÉSEAU C.R.O. ... OK', 'REGISTRE DES ACCRÉDITATIONS ... OK']) {
    await print(s, { delay: 0, into: col });
    await sleep(260);
  }
  await print(['', "Tapez HELP pour la liste des commandes."], { delay: 20, into: col });
  await print(['', "La science est un instrument de l'Ordre.", "L'Ordre est la garantie de la Vérité.", "La Vérité appartient à l'Empire."], { delay: 40, into: col, cls: 'dim' });
}

async function shell() {
  const hist = [];
  const names = [...Object.keys(COMMANDS), 'help', 'clear', 'exit']; // commandes cachées (crt, symbole, reset) exclues
  const complete = v => {
    const n = norm(v);
    if (!n) return null;
    const m = names.filter(x => x.startsWith(n));
    return m.length === 1 ? m[0] : null;
  };
  for (;;) {
    line('');
    const raw = await readLine({ prompt: '> ', history: hist, complete });
    if (raw === null) continue;
    const cmd = norm(raw);
    if (!cmd) continue;
    if (cmd === 'help' || cmd === 'aide' || cmd === '?') await help();
    else if (cmd === 'exit' || cmd === 'quit' || cmd === 'quitter') { await sleep(300); return; }
    else if (cmd === 'clear' || cmd === 'cls') clear();
    else if (cmd === 'symbole' || cmd === 'empire' || cmd === 'embleme') await showEmblem();
    else if (cmd === 'crt') {
      if (!warpOK) { await print("COURBURE NON SUPPORTÉE PAR CE NAVIGATEUR.", { cls: 'inv' }); continue; }
      const on = !world.classList.contains('warp');
      setWarp(on);
      store.set('cro.warp', on ? 'on' : 'off');
      await print(`COURBURE DE L'ÉCRAN : ${on ? 'ACTIVÉE' : 'DÉSACTIVÉE'}.`);
    }
    else if (COMMANDS[cmd]) { await COMMANDS[cmd].run(); }
    else if (cmd === 'reset') {
      // commande non documentée : remet à zéro le rapport et les accréditations
      const c = await readLine({ prompt: 'RÉINITIALISER LA SESSION ? (O/N) > ' });
      if (c && norm(c) === 'o') { store.del('cro.rapport'); store.del('cro.rapport.draft'); await print('SESSION RÉINITIALISÉE.'); }
    }
    else await print(`COMMANDE INCONNUE : « ${raw.trim().toUpperCase()} ». TAPEZ HELP.`, { cls: 'inv' });
  }
}

initCRT();
(async () => {
  // La police doit être chargée avant toute mesure de cellule (taille de l'emblème, pagination).
  try { await Promise.race([document.fonts.load('18px "Pixel Code"'), sleep(2500)]); } catch (e) {}
  for (;;) { await boot(); await shell(); }
})();
})();
